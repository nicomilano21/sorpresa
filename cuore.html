<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Una sorpresa per te ❤️</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    background: radial-gradient(circle, #28001f, #08000c 75%);
    display: flex;
    justify-content: center;
    align-items: center;
    flex-direction: column;
    overflow: hidden;
    font-family: Arial, sans-serif;
    color: white;
}

h1 {
    color: #ff72c6;
    text-shadow: 0 0 20px #ff1493;
    font-size: clamp(22px, 5vw, 38px);
    text-align: center;
    animation: apparizione 2s ease;
}

#heart {
    width: 100%;
    max-width: 850px;
    padding: 10px;
    text-align: center;
    font-family: monospace;
    font-size: clamp(8px, 1.5vw, 15px);
    line-height: 1.15;
    font-weight: bold;
    white-space: pre;
    color: #ff69b4;
    text-shadow: 0 0 8px #ff1493, 0 0 18px #ff69b4;
}

#heart span {
    opacity: 0;
    animation: luce 0.3s forwards;
}

.final {
    margin-top: 20px;
    color: #ffb6dc;
    font-size: clamp(17px, 4vw, 25px);
    text-align: center;
    opacity: 0;
    transition: opacity 2s;
    text-shadow: 0 0 15px #ff1493;
}

@keyframes luce {
    to { opacity: 1; }
}

@keyframes apparizione {
    from { opacity: 0; transform: translateY(-20px); }
    to { opacity: 1; transform: translateY(0); }
}
</style>
</head>

<body>

<h1>Una sorpresa speciale per te...</h1>

<div id="heart"></div>

<div class="final" id="final">
    ❤️ BUON COMPLEANNO! ❤️
    <br>
    Non dimenticare mai quanto sei speciale.
</div>

<script>
const heart = document.getElementById("heart");

const width = 65;
const height = 27;
const word = "AUGURI";
let index = 0;

let content = "";

for (let row = 0; row < height; row++) {

    const y = 1.3 - row * 2.6 / (height - 1);

    for (let col = 0; col < width; col++) {

        const x = (col - width / 2) / (width / 3);

        const formula =
            Math.pow(x*x + y*y - 1, 3)
            - x*x*Math.pow(y, 3);

        if (formula <= 0) {
            const letter = word[index % word.length];
            content += `<span>${letter}</span>`;
            index++;
        } else {
            content += " ";
        }
    }

    content += "\n";
}

heart.innerHTML = content;

const letters = heart.querySelectorAll("span");

let i = 0;

function animateHeart() {

    if (i < letters.length) {
        letters[i].style.opacity = "1";
        i++;

        setTimeout(animateHeart, 12);
    } else {
        document.getElementById("final").style.opacity = "1";
    }
}

setTimeout(animateHeart, 1500);
</script>

</body>
</html>
